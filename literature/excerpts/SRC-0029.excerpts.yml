    section: Abstract
    paragraph_or_table: Method contribution
  capture_state: location_identified
  usage_mode: paraphrase
  verbatim_excerpt: null
  faithful_paraphrase: The paper introduces security problem frames, concretized security problem frames and generic
    sequence diagrams as a three-stage path from a security problem to an implementable specification.
  researcher_interpretation: Treat the stages as separate governed artifact types rather than one continuously overwritten
    model.
  supported_proposition: The method explicitly separates problem representation, solution principle and concrete
    specification.
  thesis_targets:
  - chapter-3
  - chapter-5
  temporal_caveat: Foundational 2006 method evidence. The problem/solution separation and explicit assumption structure
    remain conceptually relevant; cryptographic choices, Common Criteria references and tool/process maturity require
    contemporary corroboration.
  verification_state: location_verified
