    section: 2 Problem Frames
    paragraph_or_table: Problem-frame definition
  capture_state: location_identified
  usage_mode: paraphrase
  verbatim_excerpt: null
  faithful_paraphrase: A problem frame classifies a development problem through its context, domains, interfaces
    and requirement; a frame diagram represents those elements and their shared phenomena.
  researcher_interpretation: A DDTA Base Analysis needs typed context elements and relations before a problem-frame
    overlay can be applied.
  supported_proposition: Problem-frame analysis depends on a structured context representation rather than unstructured
    prose alone.
  thesis_targets:
