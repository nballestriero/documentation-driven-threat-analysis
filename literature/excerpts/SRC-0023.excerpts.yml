    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "The proof-of-concept query reported seven of eleven applicable-standard relations without an explicit tailoring."
    researcher_interpretation: "Typed graph rules can surface review candidates that are not visible from isolated document links."
