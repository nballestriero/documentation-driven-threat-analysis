    location: {pdf_page: 31, printed_page: 2163, section: "7.5.2 Challenges and future work", paragraph_or_table: ""}
    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "Baselines can represent versions as distinct traceable entities, while change propagation depends on relation and change type; distinguishing editorial and semantic change remains open."
    researcher_interpretation: "DDTA stale detection needs typed changes and baseline-aware relation identity."
    supported_proposition: "Version-aware traceability requires semantics for both relation type and change type."
    thesis_targets: ["chapter-3", "chapter-5"]
    temporal_caveat: "The open problem should be corroborated with post-2022 change-impact studies."
