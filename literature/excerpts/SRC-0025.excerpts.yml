    location: {pdf_page: 8, printed_page: 162, section: "5.3 Threats to Validity", paragraph_or_table: ""}
    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "The authors caution that projects and student-authored requirements may not represent industry, datasets are imbalanced and machine translation may bias results."
    researcher_interpretation: "The classification result is benchmark evidence, not an industrial prevalence estimate."
    supported_proposition: "External and construct validity require explicit project, authorship and language caveats."
    thesis_targets: ["chapter-4", "chapter-8"]
    temporal_caveat: "Explicit author limitations."
    verification_state: location_verified
  - id: SRC-0025-EX-0009
    location: {pdf_page: 9, printed_page: 163, section: "6.1 Comparison to FTLR without Filters", paragraph_or_table: "Table V"}
    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "The automated functional filter raises best average F1 from 34.5 to 35.3 percent with original thresholds and from 37.8 to 38.8 percent with optimized thresholds."
    researcher_interpretation: "The measured benefit is real but modest, and the optimized result is an upper-bound scenario."
    supported_proposition: "Classification-based filtering can improve FTLR in the reported benchmark setup."
    thesis_targets: ["chapter-3", "chapter-4"]
    temporal_caveat: "The optimized-threshold comparison uses known project links."
    verification_state: location_verified
  - id: SRC-0025-EX-0010
    location: {pdf_page: 10, printed_page: 164, section: "6.2 and 6.3", paragraph_or_table: "Tables VI and VII"}
    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "Combining template and functional filters reaches 40.7 percent average F1; under optimized comparison, filtered FTLR leads average F1 and F2, while the best method still varies by project."
    researcher_interpretation: "No single preprocessing or recovery configuration should be assumed to generalize."
    supported_proposition: "Complementary filters can help, but performance remains project-dependent."
    thesis_targets: ["chapter-3", "chapter-4"]
    temporal_caveat: "The comparison is restricted to selected unsupervised approaches and per-project optimized thresholds."
