  - id: SRC-0025-EX-0001
    location: {pdf_page: 1, printed_page: 155, section: "Abstract", paragraph_or_table: ""}
    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "The work trains NoRBERT on a new requirement-element dataset and uses its classifications to filter text before FTLR trace recovery."
    researcher_interpretation: "The contribution is a preprocessing-plus-recovery pipeline, not an end-to-end security-analysis method."
    supported_proposition: "Task-specific requirement classification can be integrated before trace-link recovery."
    thesis_targets: ["chapter-3", "chapter-4", "chapter-5"]
    temporal_caveat: "NoRBERT is a BERT-based classifier, not a current generative LLM."
    verification_state: location_verified
  - id: SRC-0025-EX-0002
    location: {pdf_page: 2, printed_page: 156, section: "1 Introduction", paragraph_or_table: "Contributions"}
    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "The authors create a labeled requirement-element dataset, evaluate classification on traceability benchmarks and evaluate filtering in FTLR."
    researcher_interpretation: "The evaluation separates classifier quality from downstream trace recovery."
    supported_proposition: "Component and end-to-end performance should both be measured."
    thesis_targets: ["chapter-3", "chapter-4"]
    temporal_caveat: "The benchmark family predates later RAG and generative methods."
    verification_state: location_verified
  - id: SRC-0025-EX-0003
    location: {pdf_page: 5, printed_page: 159, section: "4.2 Integration of Classification in FTLR", paragraph_or_table: "Figure 4 and filter definitions"}
    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "FTLR can filter elements lacking functional aspects, filter user-related elements, or combine both decisions before trace recovery."
    researcher_interpretation: "DDTA filtering must record task-specific semantics and preserve excluded evidence."
    supported_proposition: "Preprocessing decisions directly determine which evidence can enter candidate recovery."
    thesis_targets: ["chapter-3", "chapter-5"]
    temporal_caveat: "The filter meanings are specific to requirement-to-code mapping."
    verification_state: location_verified
  - id: SRC-0025-EX-0004
    location: {pdf_page: 5, printed_page: 159, section: "4.2 Integration of Classification in FTLR", paragraph_or_table: "Category clarification"}
    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "An element without functional aspects is not necessarily a non-functional requirement."
    researcher_interpretation: "The functional filter cannot be reinterpreted as a general rule that non-functional or security text is irrelevant."
    supported_proposition: "Filter labels must not be conflated with broader requirement taxonomies."
    thesis_targets: ["chapter-2", "chapter-5"]
    temporal_caveat: "Definition-level proposition."
    verification_state: location_verified
  - id: SRC-0025-EX-0005
    location: {pdf_page: 6, printed_page: 160, section: "5 Empirical Study on Classification", paragraph_or_table: "Tables I and II"}
    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "The new subset contains 447 requirements and 3,284 elements; two annotators achieve Krippendorff alpha values from 0.742 to 0.905 across labels."
    researcher_interpretation: "Ground-truth provenance and inter-annotator reliability must be governed evaluation evidence."
