    verbatim_excerpt: null
    faithful_paraphrase: "The assessment distinguishes requirements, attacker behavior, security assumptions, architectural design, source code and goals, represented textually or through models."
    researcher_interpretation: "DDTA must record both artifact type and representation layer."
    supported_proposition: "Input type and representation are separate method-selection dimensions."
