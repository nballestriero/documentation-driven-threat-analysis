    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "Threat analysis requires knowledge of what the system is and what it must be protected from."
    researcher_interpretation: "Documentation-first does not mean information-free; the minimum information contract must be explicit."
    supported_proposition: "System and adversarial context are minimum threat-analysis inputs."
    thesis_targets: ["chapter-2", "chapter-5"]
    temporal_caveat: "The paper does not define a sufficient raw-document set."
    verification_state: location_verified
  - id: SRC-0026-EX-0005
    location: {pdf_page: 9, printed_page: 9, section: "3.2 RQ1 Characteristics", paragraph_or_table: "Applicability"}
    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "Fourteen techniques apply at requirements level, eleven at architecture, thirteen at design and only two at implementation."
    researcher_interpretation: "The first DDTA analysis can be evaluated independently of source code."
    supported_proposition: "The reviewed threat-analysis literature is predominantly pre-implementation."
    thesis_targets: ["chapter-3", "chapter-5"]
    temporal_caveat: "Counts describe methods selected before 2017."
    verification_state: location_verified
  - id: SRC-0026-EX-0006
    location: {pdf_page: 9, printed_page: 9, section: "3.2 RQ1 Characteristics", paragraph_or_table: "Input"}
    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "Requirements and architectural design are common inputs; only one technique considers source code, where it is optional; textual descriptions occur more often than models."
    researcher_interpretation: "Code is later evidence, while the unresolved problem is constructing an adequate system representation from documentation."
    supported_proposition: "Source code is not normally required for early threat analysis."
    thesis_targets: ["chapter-3", "chapter-5"]
    temporal_caveat: "This does not prove that arbitrary raw documentation is sufficient."
    verification_state: location_verified
