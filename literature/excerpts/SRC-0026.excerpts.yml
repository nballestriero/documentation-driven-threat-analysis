    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "About half of the methods use knowledge bases, while precision often remains at examples or templates; only four families are classified as very precise."
    researcher_interpretation: "Overlay procedures need executable rules, diagnostic output and a declared completion condition."
    supported_proposition: "Procedure precision varies substantially across threat-analysis techniques."
    thesis_targets: ["chapter-3", "chapter-5"]
    temporal_caveat: "Specific method classifications require the original primary studies for final claims."
