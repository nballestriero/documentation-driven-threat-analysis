    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "The review distinguishes risk-centric, attack-centric and software-centric techniques and also identifies GORE, SRE and privacy families."
    researcher_interpretation: "DDTA can use a neutral Base Analysis while overlays declare their focus and required views."
    supported_proposition: "Threat-analysis methods organize the problem around different analytical centers."
    thesis_targets: ["chapter-2", "chapter-3", "chapter-5"]
