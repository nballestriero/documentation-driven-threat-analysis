  verbatim_excerpt: null
  faithful_paraphrase: The mapping study reviews methods that derive architectural models from requirements specifications,
    selects 39 studies from 2575 records and reports heavy dependence on architects' tacit knowledge, weak support
    for inexperienced architects and limited explicit evaluation.
  researcher_interpretation: The source maps a requirements-to-architecture boundary rather than validating one
    complete derivation method.
  supported_proposition: Requirements-to-architecture methods remain strongly dependent on expert judgment and
    weak evaluation.
  thesis_targets:
  - chapter-3
  - chapter-4
  - chapter-7
  temporal_caveat: Historical systematic mapping study published in 2019. The 39 selected primary studies extend
    through the mid-2010s and the paper does not establish the state of requirements-to-architecture automation,
    traceability, tool maturity or LLM-based support in 2026. Its boundary findings on tacit knowledge, partial
    automation, multi-view architecture and weak validation remain conceptually relevant.
  verification_state: location_verified
