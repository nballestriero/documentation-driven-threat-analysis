    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "Links among use cases, misuse cases and countermeasures support explanation, prioritization and tracing security requirements to motivating threats."
    researcher_interpretation: "DDTA should preserve source-to-scenario-to-finding-to-requirement provenance."
    supported_proposition: "Typed links support security-requirement rationale and change management."
    thesis_targets: ["chapter-3", "chapter-5"]
