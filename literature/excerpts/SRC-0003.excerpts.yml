    verbatim_excerpt: null
    faithful_paraphrase: "The paper extends ordinary use cases with negative scenarios to support early elicitation of security threats and requirements."
    researcher_interpretation: "The method is documentation-primary and pre-code, but assumes structured functional scenarios."
    supported_proposition: "Security analysis can be integrated with early use-case-based requirements work."
    thesis_targets: ["chapter-2", "chapter-3", "chapter-5"]
    temporal_caveat: "Foundational method evidence from 2005."
    verification_state: location_verified
  - id: SRC-0003-EX-0002
    location: {pdf_page: 2, printed_page: 35, section: "2 Concepts and notation", paragraph_or_table: "Definitions"}
    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "A misuse case is a harmful action sequence, and a misuser is an intentional or inadvertent actor that initiates it."
    researcher_interpretation: "Candidate threat actors and harmful paths should be typed overlay entities and marked as inferred when analyst-created."
    supported_proposition: "The method models actor and harmful behavior explicitly."
    thesis_targets: ["chapter-2", "chapter-5"]
    temporal_caveat: "Definition-level proposition."
    verification_state: location_verified
  - id: SRC-0003-EX-0003
    location: {pdf_page: 2, printed_page: 35, section: "2 Concepts and notation", paragraph_or_table: "Metamodel and relationships"}
    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "Misuse cases threaten ordinary use cases, while security use cases mitigate misuse cases."
    researcher_interpretation: "Threat, threatened behavior and countermeasure must remain separate linked records."
    supported_proposition: "The notation provides typed threat and mitigation relations."
    thesis_targets: ["chapter-2", "chapter-5"]
    temporal_caveat: "UML notation is optional according to the authors."
    verification_state: location_verified
  - id: SRC-0003-EX-0004
    location: {pdf_page: 3, printed_page: 36, section: "3.1 Lightweight misuse case description", paragraph_or_table: "Threats field or column"}
    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "A lightweight template adds a threat field or column; an empty field signals that security still needs investigation, while an explicit disposition records a considered low-risk case."
    researcher_interpretation: "DDTA can record per-scenario coverage and explicit no-material-threat decisions."
    supported_proposition: "The template makes local review status visible."
    thesis_targets: ["chapter-4", "chapter-5"]
    temporal_caveat: "Local review status is not a global stopping rule."
    verification_state: location_verified
  - id: SRC-0003-EX-0005
    location: {pdf_page: 4, printed_page: 37, section: "3.2 Extensive misuse case description", paragraph_or_table: "Table 3"}
    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "The extensive template records harmful paths, mitigation points, triggers, assumptions, preconditions, guarantees, rules, misuser profiles, scope and stakeholder risks."
    researcher_interpretation: "These fields define a candidate overlay evidence contract."
    supported_proposition: "Detailed misuse cases preserve context needed for analysis and review."
    thesis_targets: ["chapter-4", "chapter-5"]
    temporal_caveat: "The paper does not define machine-readable validation rules."
    verification_state: location_verified
  - id: SRC-0003-EX-0006
