    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "The process identifies assets, defines security goals, identifies threats, analyzes risk and defines security requirements matched to risk and cost."
    researcher_interpretation: "The method requires a minimum system-and-security context before candidate generation."
    supported_proposition: "Misuse-case elicitation is embedded in a broader security-requirements process."
    thesis_targets: ["chapter-2", "chapter-3", "chapter-5"]
    temporal_caveat: "No mandatory risk model is specified."
    verification_state: location_verified
