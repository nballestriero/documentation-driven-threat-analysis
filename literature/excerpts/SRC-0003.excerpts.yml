  - id: SRC-0003-EX-0011
    location: {pdf_page: 8, printed_page: 41, section: "6.2 Weaknesses", paragraph_or_table: "Guidance and analysis paralysis"}
    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "Open-ended guidance forces analyst improvisation, can introduce defects and can cause analysis paralysis; prioritization and stopping criteria need further development."
    researcher_interpretation: "DDTA needs explicit diagnostics, coverage rules and completion criteria beyond the source method."
    supported_proposition: "The method lacks repeatable discovery and stopping guarantees."
    thesis_targets: ["chapter-3", "chapter-5", "chapter-8"]
    temporal_caveat: "A foundational limitation requiring contemporary corroboration."
    verification_state: location_verified
  - id: SRC-0003-EX-0012
    location: {pdf_page: 8, printed_page: 41, section: "6.2 Weaknesses", paragraph_or_table: "Threats poorly suited to misuse cases"}
    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "Misuse cases fit poorly when no identifiable misuser, harmful action sequence or threatened use case exists."
    researcher_interpretation: "A misuse-case overlay cannot replace structural, data-flow or other threat-analysis overlays."
    supported_proposition: "Scenario-based analysis has a bounded applicability domain."
    thesis_targets: ["chapter-3", "chapter-5"]
    temporal_caveat: "The limitation is conceptual rather than tool-specific."
    verification_state: location_verified
  - id: SRC-0003-EX-0013
    location: {pdf_page: 9, printed_page: 42, section: "8 Conclusion and further work", paragraph_or_table: ""}
    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "The authors conclude that misuse cases improve early integration and traceability but that guidance remains too general and the technique is not suitable for every threat."
    researcher_interpretation: "The method is a useful overlay family, not a complete DDTA method."
    supported_proposition: "Scenario-based negative analysis should be combined with other techniques."
