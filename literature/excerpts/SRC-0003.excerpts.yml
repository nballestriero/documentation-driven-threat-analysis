    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "The process is cyclic because countermeasures may introduce new assets and threats, and reusable threat-requirement repositories may support analysis."
    researcher_interpretation: "Overlay reruns and provenance are needed when mitigations or documentation change."
    supported_proposition: "Security-requirements analysis is iterative rather than one-shot."
