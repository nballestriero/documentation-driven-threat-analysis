  verbatim_excerpt: null
  faithful_paraphrase: The review examines empirical evidence on automated requirements engineering, classifies
    85 studies from 1996-2022 and reports tool outputs, supported RE phases, automation levels, development techniques
    and evaluation approaches.
  researcher_interpretation: The source is a broad automation landscape rather than a controlled comparison of
    one transformation technique.
  supported_proposition: The paper systematically maps implemented automated-RE support across five comparison
    dimensions.
  thesis_targets:
  - chapter-3
  - chapter-4
  - chapter-7
  temporal_caveat: Systematic literature review published in 2024 from searches completed in December 2022. The
    taxonomy of inputs, outputs, RE phases, automation levels and evaluation methods remains useful, while current
    LLM-based techniques, tool availability, industrial adoption and performance require contemporary corroboration.
    The 85 studies are heterogeneous and no common benchmark supports direct comparison.
  verification_state: location_verified
