    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "The search reduced 3609 initial records to 29 studies, assessed 11 candidate papers, selected six candidate SOTA papers and used 13 Java datasets for replication."
    researcher_interpretation: "The study provides a transparent narrowing chain, but its language and artifact scope remain narrow."
    supported_proposition: "Candidate methods and datasets were selected through explicit filtering stages."
    thesis_targets: ["chapter-3", "chapter-4"]
    temporal_caveat: "All experimental datasets are Java."
