    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "Precision and recall appear in 92.86 percent of the reviewed studies, while F1 appears in 71.43 percent."
    researcher_interpretation: "DDTA should retain these metrics but add review-effort and confidence measures."
    supported_proposition: "Precision, recall and F1 are core comparable RC-TLR metrics."
    thesis_targets: ["chapter-2", "chapter-4"]
    temporal_caveat: "Frequency in a literature sample does not prove metric sufficiency."
