    paragraph_or_table: Three MBT steps
  capture_state: location_identified
  usage_mode: paraphrase
  verbatim_excerpt: null
  faithful_paraphrase: The general MBT process builds a test model from requirements, specifications or the
    SUT, defines test-selection criteria and automatically generates implementation-independent tests that
    later require concretization.
  researcher_interpretation: DDTA must separate source artifacts, test model, selection criteria, abstract
    tests and executable tests.
  supported_proposition: Abstract model-derived tests and concrete executable tests are distinct artifacts.
