  usage_mode: paraphrase
  verbatim_excerpt: null
  faithful_paraphrase: The Rapid Review examines model-based security testing for IoT, analyzes 803 publications,
    selects 17 primary studies and classifies formalisms, test techniques, objectives, domains and attacks.
  researcher_interpretation: The source provides a recent taxonomy of model-to-security-test generation, not
    evidence for automatic document-to-model construction.
  supported_proposition: The review is a systematic classification of MBST research in IoT.
  thesis_targets:
  - chapter-3
  - chapter-4
  - chapter-7
  temporal_caveat: Rapid Review published in 2023 from searches completed in April 2022. The taxonomy and model-to-test
    boundary remain relevant, while tool maturity, IoT technologies, attack coverage and industrial adoption
    require contemporary corroboration. The 17 included studies were mostly exploratory and were not quality-scored.
  verification_state: location_verified
