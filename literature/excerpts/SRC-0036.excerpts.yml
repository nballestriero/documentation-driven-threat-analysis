  usage_mode: paraphrase
  verbatim_excerpt: null
  faithful_paraphrase: Producing correct and complete UML class diagrams from textual descriptions is challenging
    for students and novice designers, while earlier LLM work produced reasonably complete but lower-quality models
    than humans.
  researcher_interpretation: LLM generation addresses modeling effort but inherits a semantic assurance problem.
  supported_proposition: LLMs may assist class-diagram production but prior evidence does not establish human-equivalent
    quality.
