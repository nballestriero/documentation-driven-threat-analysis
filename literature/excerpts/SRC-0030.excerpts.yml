    section: 8 Threats to validity
    paragraph_or_table: Study design, binary ground truth, and external validity
  capture_state: location_identified
  usage_mode: paraphrase
  verbatim_excerpt: null
  faithful_paraphrase: Key limitations include student participants, different scenarios and delivery modes,
    self-reported perception, a binary ground truth restricted to one contradiction pattern, the chosen equivalence
    margin, and a sequence diagram supplied to every participant.
  researcher_interpretation: The findings should challenge DFD-centric assumptions without being generalized
    into a claim that DFDs are useless.
  supported_proposition: The study's internal, external, and conclusion validity constraints substantially
    narrow its claims.
