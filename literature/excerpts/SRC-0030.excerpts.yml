  capture_state: location_identified
  usage_mode: paraphrase
  verbatim_excerpt: null
  faithful_paraphrase: Difference and equivalence were tested with Mann-Whitney U procedures at alpha 0.05;
    the authors chose an equivalence margin of one correct classification or one Likert point.
  researcher_interpretation: Equivalence claims must retain the author-chosen delta and cannot be generalized
    to exact equality.
  supported_proposition: The reported equivalence is conditional on a delta of one.
