    paragraph_or_table: DFD maintenance motivation
  capture_state: location_identified
  usage_mode: paraphrase
  verbatim_excerpt: null
  faithful_paraphrase: The authors note that DFDs may become out of sync as software design is refined and
    ask whether the effort of maintaining them beyond threat elicitation is justified.
  researcher_interpretation: DDTA needs explicit stale detection and maintenance-cost evaluation rather than
    assuming persistent model value.
  supported_proposition: The sustainability of maintaining DFDs after initial threat analysis is an open empirical
    problem.
