    capture_state: location_identified
    usage_mode: paraphrase
    verbatim_excerpt: null
    faithful_paraphrase: "The authors caution that the sample is small, mostly European, weighted toward large companies and agile practice, and has limited statistical power for subgroup comparisons."
    researcher_interpretation: "The study should be used as scoped contemporary evidence rather than as a population prevalence estimate."
    supported_proposition: "The findings require explicit geographic, sampling and statistical caveats."
