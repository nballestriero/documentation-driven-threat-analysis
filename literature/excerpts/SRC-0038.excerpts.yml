  capture_state: location_identified
  usage_mode: paraphrase
  verbatim_excerpt: null
  faithful_paraphrase: The study reviews 85 LLM-centric ICSE and ASE articles, identifies 18 OpenAI studies with
    apparently available artifacts, finds only five sufficiently executable and fully reproduces none.
  researcher_interpretation: The source provides direct empirical evidence that publication and apparent artifact
    availability do not establish reproducibility.
  supported_proposition: Only a small subset of apparently eligible commercial-LLM studies can be independently
    executed, and none of the five executable studies is completely reproduced.
  thesis_targets:
  - chapter-3
  - chapter-7
  - chapter-8
  temporal_caveat: The study was published for ICSE 2026 and reproduces selected ICSE/ASE 2024 experiments using
    commercial endpoints, models and dependencies available during the authors' reproduction window. Counts and
    failure patterns support provenance and maintenance controls; they do not establish current provider performance
    or universal reproducibility rates in August 2026.
  verification_state: location_verified
