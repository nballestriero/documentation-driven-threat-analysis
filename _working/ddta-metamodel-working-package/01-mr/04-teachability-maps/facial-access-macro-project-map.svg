<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Facial-access Macro Project Map</title><desc id="desc">Macro Project Map with 4 Macro Requirement blocks and 4 labeled relationships. Solid links are explicit MR relations; dashed links are non-canonical didactic interpretations.</desc><style>
svg{background:#fafafa;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.mr-node rect{fill:#ffffff;stroke:#18181b;stroke-width:2.5}
.mr-node text{text-anchor:middle;pointer-events:none}
.mr-node .role{font-size:11px;letter-spacing:1px;fill:#71717a}
.mr-node .title{font-size:16px;font-weight:700;fill:#18181b}
.mr-node .identity{font-size:11px;fill:#52525b}
.mr-link line,.mr-link path{stroke:#18181b;stroke-width:2.4}
.edge-label-bg{fill:#ffffff;stroke:#d4d4d8}
.edge-label{text-anchor:middle;font-size:13px;font-weight:700;fill:#18181b}
</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#18181b"/></marker></defs><g class="mr-link explicit" data-link-id="MRMAP-REL-0001" data-authority="explicit_mr_relation"><title>depends on - MRMAP-REL-0001</title><line x1="490" y1="375.0" x2="390" y2="140.0" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="380.0" y="238.5" width="120" height="36" rx="7"/><text class="edge-label" x="440.0" y="260.5">depends on</text></g><g class="mr-link explicit" data-link-id="MRMAP-REL-0002" data-authority="explicit_mr_relation"><title>depends on - MRMAP-REL-0002</title><line x1="790" y1="375.0" x2="890" y2="140.0" marker-end="url(#arrow)"/><rect class="edge-label-bg" x="780.0" y="238.5" width="120" height="36" rx="7"/><text class="edge-label" x="840.0" y="260.5">depends on</text></g><g class="mr-link didactic" data-link-id="MRMAP-REL-0003" data-authority="didactic_interpretation"><title>responsible biometric / ML use - MRMAP-REL-0003</title><line x1="1040.0" y1="525" x2="1040.0" y2="205" marker-end="url(#arrow)" stroke-dasharray="10 8"/><rect class="edge-label-bg" x="923.0" y="346.0" width="234" height="36" rx="7"/><text class="edge-label" x="1040.0" y="368.0">responsible biometric / ML use</text></g><g class="mr-link didactic" data-link-id="MRMAP-REL-0004" data-authority="didactic_interpretation"><title>effects of automatic access decisions - MRMAP-REL-0004</title><line x1="890" y1="590.0" x2="790" y2="375.0" marker-end="url(#arrow)" stroke-dasharray="10 8"/><rect class="edge-label-bg" x="698.5" y="463.5" width="283" height="36" rx="7"/><text class="edge-label" x="840.0" y="485.5">effects of automatic access decisions</text></g><g class="mr-node" data-mr-id="MR-0002"><title>Gestione delle persone autorizzate - MR-0002</title><rect x="90" y="75" width="300" height="130" rx="14"/><text class="role" x="240.0" y="97">MACRO REQUIREMENT</text><text class="title" x="240.0" y="119"><tspan x="240.0" dy="0">Gestione delle persone</tspan><tspan x="240.0" dy="21">autorizzate</tspan></text><text class="identity" x="240.0" y="192">MR-0002</text></g><g class="mr-node" data-mr-id="MR-0003"><title>Riconoscimento facciale per la verifica della persona - MR-0003</title><rect x="890" y="75" width="300" height="130" rx="14"/><text class="role" x="1040.0" y="97">MACRO REQUIREMENT</text><text class="title" x="1040.0" y="119"><tspan x="1040.0" dy="0">Riconoscimento facciale per la</tspan><tspan x="1040.0" dy="21">verifica della persona</tspan></text><text class="identity" x="1040.0" y="192">MR-0003</text></g><g class="mr-node" data-mr-id="MR-0001"><title>Accesso controllato all&#x27;area riservata - MR-0001</title><rect x="490" y="310" width="300" height="130" rx="14"/><text class="role" x="640.0" y="332">MACRO REQUIREMENT</text><text class="title" x="640.0" y="354"><tspan x="640.0" dy="0">Accesso controllato all&#x27;area</tspan><tspan x="640.0" dy="21">riservata</tspan></text><text class="identity" x="640.0" y="427">MR-0001</text></g><g class="mr-node" data-mr-id="MR-0004"><title>Uso responsabile dei dati biometrici e delle decisioni automatiche - MR-0004</title><rect x="890" y="525" width="300" height="130" rx="14"/><text class="role" x="1040.0" y="547">MACRO REQUIREMENT</text><text class="title" x="1040.0" y="559"><tspan x="1040.0" dy="0">Uso responsabile dei dati</tspan><tspan x="1040.0" dy="21">biometrici e delle decisioni</tspan><tspan x="1040.0" dy="21">automatiche</tspan></text><text class="identity" x="1040.0" y="642">MR-0004</text></g></svg>