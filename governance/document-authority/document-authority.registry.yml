schemaVersion: 1
registryKey: ddta-document-authority
basedOnRepositoryCommit: fa8f5affe29143764230e43ec52514bf7f3ee8df

rules:
  chronologicalRecencyImpliesAuthority: false
  unclassifiedArtifactPrimaryBASourceAllowed: false
  workingTreeDefaultAuthority: EXPERIMENTAL_NON_CANONICAL
  primaryBASourceRequiredAuthority:
    - CURRENT_GOVERNED

authorityClasses:
  - CURRENT_GOVERNED
  - CLOSURE_AUTHORITY
  - HISTORICAL
  - SUPERSEDED
  - EXPERIMENTAL_NON_CANONICAL

researchRoles:
  - REGRESSION_EVIDENCE
  - CURRENT_THESIS_VALIDATION_CORPUS

entries:
  - familyKey: facial-access-historical-mr-example
    pathPrefix: _working/ddta-metamodel-working-package/01-mr/03-example-facial-access/
    authorityStatus: EXPERIMENTAL_NON_CANONICAL
    researchRole: REGRESSION_EVIDENCE
    primaryBASourceAllowed: false
    introducedAtCommit: 37b101c8700d5be2abc8ba8d44595eb9e73db48d
    lastVerifiedSemanticRevisionCommit: 2db7604e0bedf10c4aeb3795a210e141e8db9218
    retainedFor:
      - MR metamodel research history
      - teachability regression
      - old-vs-current documentation comparison
    successor:
      authorityBaselineKey: FACIAL-ACCESS-GOV-R1
      pathPrefix: governed-corpora/facial-access/current/

  - familyKey: facial-access-historical-decision-demo
    pathPrefix: 02-decision/05-example-facial-access/
    authorityStatus: EXPERIMENTAL_NON_CANONICAL
    researchRole: REGRESSION_EVIDENCE
    primaryBASourceAllowed: false
    retainedFor:
      - Decision authoring research history
      - migration provenance
      - old-vs-current documentation comparison
    successor:
      authorityBaselineKey: FACIAL-ACCESS-GOV-R1
      pathPrefix: governed-corpora/facial-access/current/

  - familyKey: facial-access-s1-camera-study
    pathPrefix: 04-specialized-requirement/03-example-facial-access/
    authorityStatus: EXPERIMENTAL_NON_CANONICAL
    researchRole: REGRESSION_EVIDENCE
    primaryBASourceAllowed: false
    retainedFor:
      - SpecializedRequirement falsification evidence
      - architecture mutation regression
      - historical camera and transport pressure cases
    successor:
      authorityBaselineKey: FACIAL-ACCESS-GOV-R1
      pathPrefix: governed-corpora/facial-access/current/

  - familyKey: facial-access-r24-working-successor-candidate
    pathPrefix: methodology/DDTA_FACIAL_ACCESS_PROJECT_DOCUMENTATION_WORKING_R24_PROJECT_ONLY.tex
    authorityStatus: EXPERIMENTAL_NON_CANONICAL
    primaryBASourceAllowed: false
    retainedFor:
      - R24 documentation-authoring pressure test
      - Base Analysis derivation and regression research
      - candidate successor review against FACIAL-ACCESS-GOV-R1
    scope:
      - working facial-access project documentation
      - methodology pressure testing before explicit promotion
    exclusions:
      - CURRENT_GOVERNED authority
      - automatic supersession of FACIAL-ACCESS-GOV-R1
      - primary Base Analysis source use before explicit promotion

  - familyKey: facial-access-r24-mr0003-semantic-successor-candidate
    pathPrefix: governed-corpora/facial-access/candidate-r2/
    authorityStatus: EXPERIMENTAL_NON_CANONICAL
    primaryBASourceAllowed: false
    retainedFor:
      - R24 MR-0003 semantic-correction pressure test
      - downstream Decision and FunctionalRequirement compatibility review
      - candidate Base Analysis derivation after explicit promotion
    scope:
      - MR-0003 successor candidate only
      - identity-not-yet-determined entry-state clarification
    exclusions:
      - CURRENT_GOVERNED authority
      - primary Base Analysis source use before explicit promotion
      - automatic promotion of existing downstream Decision or FunctionalRequirement semantics

  - familyKey: facial-access-current-governed-validation-corpus
    pathPrefix: governed-corpora/facial-access/current/
    authorityStatus: SUPERSEDED
    researchRole: REGRESSION_EVIDENCE
    authorityBaselineKey: FACIAL-ACCESS-GOV-R1
    primaryBASourceAllowed: false
    migratedFromRepositoryCommit: eef1031e47f91f60f18121aba09b6386699f8317
    retainedFor:
      - R24 semantic-review regression evidence
      - old-vs-candidate MR-0003 comparison
      - downstream Decision and FunctionalRequirement compatibility review
    scope:
      - superseded MR-0003 identity-verification branch
      - Decisions previously used to select facial recognition and camera/recognition placement
      - Functional requirements previously used by the camera transfer trial
      - Security requirements specializing the delivery behavior
      - explicit unresolved documentation gaps
    exclusions:
      - current project authority after the R24 MR-0003 semantic finding
      - primary Base Analysis source use
      - complete production specification
      - complete facial-access project migration
      - Base Analysis materialization
      - methodology-specific threat semantics
