# Canonical BA operator guide format. Only the operator guide is authoritative.
schemaId: BAOperatorGuide
schemaVersion: '0.1'
metadata:
  type: {type: string, required: true, default: BAOperatorGuide, const: BAOperatorGuide}
  schemaVersion: {type: string, required: true, default: '0.1', const: '0.1'}
  id: {type: string, required: true, default: ''}
  title: {type: string, required: true, default: ''}
  reviewStatus: {type: string, required: true, default: draft, enum: [draft, reviewed]}
sections:
  - {name: Meaning, required: true, kind: text, hint: 'Smallest governed semantic fact'}
  - {name: When to use, required: true, kind: text, hint: 'Conditions supporting this operator'}
  - {name: When not to use, required: true, kind: text, hint: 'Forbidden inference and boundaries'}
  - {name: Disambiguation, required: false, kind: text, hint: 'Optional differences from other operators'}
  - {name: Canonical contract, required: true, kind: fenced, hint: 'Single yaml ba-rule block'}
  - {name: Invariants, required: false, kind: text, hint: 'Only nonredundant semantic invariants, if any'}
  - {name: Valid examples, required: true, kind: text, hint: 'Examples with supporting assumptions'}
  - {name: Invalid examples, required: true, kind: text, hint: 'Counterexamples and rationale'}
