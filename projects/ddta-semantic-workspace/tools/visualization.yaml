# DDTA visualization rules - pilot / non canonical.
# Rendering conventions only; they do not modify RDF/OWL semantics.
coreNamespace: "https://w3id.org/ddta/core#"
layout: LR

relations:
  hasInput:
    representation: arrow
    direction: object-to-subject
    label: hasInput
  hasOutput:
    representation: arrow
    direction: subject-to-object
    label: hasOutput
  hasPart:
    representation: containment
  hasMode:
    representation: containment
  constrainsInformation:
    representation: arrow
    direction: subject-to-object
    label: constrainsInformation
  gapSource:
    representation: dashed-line
    direction: object-to-subject
    edgeStyle: documentationGap
  gapTarget:
    representation: dashed-line
    direction: subject-to-object
    edgeStyle: documentationGap
  concernsEntity:
    representation: dashed-line
    direction: object-to-subject
    edgeStyle: documentationGap
  # Contract edges are available to explicit/custom projections only.
  # Standard Graph L3 omits them in SPARQL, not by modifying the source RDF.
  constrainedBy:
    representation: dashed-line
    direction: none

  hasPrimaryFunction:
    representation: arrow
    direction: subject-to-object
    label: hasPrimaryFunction
  providesFunction:
    representation: dashed-line
    direction: subject-to-object
    label: providesFunction
  hasOperationalEnvironment:
    representation: arrow
    direction: subject-to-object
    label: hasOperationalEnvironment
  prepares:
    representation: dashed-line
    direction: subject-to-object
    label: prepares
  verifies:
    representation: dashed-line
    direction: subject-to-object
    label: verifies
  adapts:
    representation: dashed-line
    direction: subject-to-object
    label: adapts
  "urn:ddta:view#informationLink":
    representation: arrow
    direction: subject-to-object
    label: informationLink
  "urn:ddta:view#informationCompositionLink":
    representation: dashed-line
    direction: subject-to-object
    label: informationCompositionLink

nodes:
  System:
    shape: rectangle
    style: system
  Environment:
    shape: rectangle
    style: environment
  Process:
    shape: rounded
    style: process
  Store:
    shape: rectangle
    style: store
  Transfer:
    shape: rectangle
    style: process
  Function:
    shape: rounded
    style: function
  FunctionalMode:
    shape: rounded
    style: functionalMode
  RelationDocumentationGap:
    shape: circle
    style: documentationGap
    label: "?"
    annotation:
      predicate: "http://www.w3.org/2000/01/rdf-schema#label"
      style: documentationGapCaption
      edgeStyle: documentationGapCaptionLeader
  EntityDocumentationGap:
    shape: circle
    style: documentationGap
    label: "?"
    annotation:
      predicate: "http://www.w3.org/2000/01/rdf-schema#label"
      style: documentationGapCaption
      edgeStyle: documentationGapCaptionLeader
  Information:
    shape: rectangle
    style: information
    showProperties: ["urn:ddta:view#cardinality"]
  Contract:
    shape: rectangle
    style: contract
  Artifact:
    shape: rectangle
    style: artifact
  ContractElement:
    shape: rectangle
    style: element
    showProperties: [minOccurs, maxOccurs]

styles:
  system: {fill: "#e0edff", stroke: "#3267a8", color: "#163e70", emitWhenUsed: true}
  environment: {fill: "#fef3c7", stroke: "#c68a24", color: "#7b4e00", emitWhenUsed: true}
  process: {fill: "#e4eaf7", stroke: "#687eb1", color: "#202d50", emitWhenUsed: true}
  store: {fill: "#edf4f8", stroke: "#4d7b91", color: "#163e50", emitWhenUsed: true}
  function: {fill: "#dbeafe", stroke: "#2563eb", color: "#172554"}
  information: {fill: "#f1f5f9", stroke: "#64748b", color: "#0f172a"}
  optionalInformation: {fill: "#f1f5f9", stroke: "#64748b", color: "#0f172a", stroke-dasharray: "6 4", emitWhenUsed: true}
  functionalMode: {fill: "#dbeafe", stroke: "#2563eb", color: "#172554", emitWhenUsed: true}
  contract: {fill: "#fef3c7", stroke: "#d97706", color: "#78350f"}
  artifact: {fill: "#e0f2fe", stroke: "#0284c7", color: "#0c4a6e", emitWhenUsed: true}
  element: {fill: "#fff7ed", stroke: "#d97706", color: "#78350f"}
  documentationGap: {fill: "#facc15", stroke: "#ca8a04", color: "#000000", stroke-width: "2px", emitWhenUsed: true}
  documentationGapCaption: {fill: "transparent", stroke: "transparent", color: "#854d0e", font-size: "12px", emitWhenUsed: true}

edgeStyles:
  documentationGap: {stroke: "#eab308", stroke-width: "2px", stroke-dasharray: "6 4"}
  documentationGapCaptionLeader: {stroke: "#94a3b8", stroke-width: "1px", stroke-dasharray: "2 3"}

# Generic semantic-to-style rule (candidate, not bound to DermaTriage).
# This view-only predicate is projected from a contract element, not asserted
# on the underlying Information entity by the DDTA source documents.
nodeVariants:
  - nodeType: Information
    predicate: "urn:ddta:view#minOccurs"
    equals: 0
    style: optionalInformation
