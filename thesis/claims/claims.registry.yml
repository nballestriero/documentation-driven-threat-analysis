  - id: CLM-0003
    statement: "STRIDE and STRIDE-AI can be implemented as distinct methodology plugins that consume the same Base Analysis and produce candidates through the same Common Finding boundary while preserving method-specific semantics."
    status: hypothesis
    evidence: []
    related_research_questions: [RQ2]

  - id: CLM-0004
    statement: "Accepted Common Findings from distinct methodologies can justify governed Security Requirements without embedding methodology-specific classifications in those requirements."
    status: design_claim
    evidence: []
    related_research_questions: [RQ3]

  - id: CLM-0005
    statement: "The provenance chain from Security Requirement to Common Finding, Analysis Record, Base Analysis subjects and governed Functional Requirement can be made machine-checkable."
    status: hypothesis
    evidence: []
    related_research_questions: [RQ3]

  - id: CLM-0006
    statement: "Baseline-aware provenance can identify dependent analysis artifacts requiring re-evaluation after relevant documentation or methodology changes."
    status: hypothesis
